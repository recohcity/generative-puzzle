const palette = ["#4e6ef2","#f2724a","#23a86d","#f7b500","#7b61ff","#e85f6b","#0fc6c2","#9c6ade","#d9800f","#2f9e44","#e8590c","#7048e8","#1098ad","#c92a2a","#5c940d","#a61e4d","#4263eb","#e67700","#37b24d","#6741d9"];
const META = { "s-curve": { zh: "S弯", en: "S-Curve" }, "zigzag": { zh: "折线", en: "Zigzag" } };
const state = {};
function buildCard(key){
  const m = META[key], steps = DATA.types[key].steps;
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="head"><span class="name">${m.zh}<span class="en">${m.en}</span></span><span class="stage" id="st-${key}">第 0 刀 · 1 片</span></div>
    <canvas id="cv-${key}" width="440" height="320"></canvas>
    <div class="ctrl">
      <button id="next-${key}" class="primary">切下一刀</button>
      <button id="auto-${key}">自动播放</button>
      <button id="rst-${key}">重置</button>
    </div>`;
  document.getElementById('cards').appendChild(card);
  state[key] = { steps, idx: 0, timer: null };
  document.getElementById('next-' + key).addEventListener('click', () => { if (state[key].idx < steps.length - 1) { state[key].idx++; draw(key); } updateBtn(key); });
  document.getElementById('auto-' + key).addEventListener('click', () => {
    const s = state[key];
    if (s.timer) { clearInterval(s.timer); s.timer = null; return; }
    s.timer = setInterval(() => { if (s.idx >= steps.length - 1) { clearInterval(s.timer); s.timer = null; updateBtn(key); return; } s.idx++; draw(key); updateBtn(key); }, 700);
    updateBtn(key);
  });
  document.getElementById('rst-' + key).addEventListener('click', () => { const s = state[key]; if (s.timer) { clearInterval(s.timer); s.timer = null; } s.idx = 0; draw(key); updateBtn(key); });
}
function draw(key){
  const s = state[key], canvas = document.getElementById('cv-' + key), ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const pts = s.steps[s.idx];
  const xs = [], ys = [];
  for (const p of pts) for (const q of p) { xs.push(q.x); ys.push(q.y); }
  const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs), minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  const pad = 22, sc = Math.min((W-pad*2)/(maxX-minX), (H-pad*2)/(maxY-minY));
  const ox = (W-(maxX-minX)*sc)/2 - minX*sc, oy = (H-(maxY-minY)*sc)/2 - minY*sc;
  pts.forEach((poly, i) => {
    ctx.beginPath();
    poly.forEach((p, j) => { const x = p.x*sc+ox, y = p.y*sc+oy; if (j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.closePath();
    ctx.fillStyle = palette[i % palette.length];
    ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  });
  document.getElementById('st-' + key).textContent = `第 ${s.idx} 刀 · ${pts.length} 片`;
}
function updateBtn(key){
  const s = state[key], b = document.getElementById('next-' + key), a = document.getElementById('auto-' + key);
  b.disabled = s.idx >= s.steps.length - 1;
  a.textContent = s.timer ? "暂停" : "自动播放";
}
Object.keys(META).forEach(buildCard);
Object.keys(META).forEach(k => draw(k));
</script>
