name: 🧩 Code Quality Check

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Workspace (Next.js & ESLint)
        run: npm run lint

      - name: Build Workspace (Monorepo & App)
        run: npm run build
        env:
          # Prevent failure due to missing backend envs during build (Bail-out safely)
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG_NAME.replace(/^refs\/tags\//, "");
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const escapedTag = tag.replace(/\./g, "\\.");
            const regex = new RegExp(`## \\[\\s*${escapedTag}\\s*\\][^\\n]*\\n+([\\s\\S]*?)(?=\\n## \\[|\\n---|$)`);
            const match = content.match(regex);
            
            let name = tag;
            let body = "";
            
            if (match && match[1]) {
              let block = match[1].trim();
              const titleMatch = block.match(/^###\s+(.+)$/m);
              if (titleMatch) {
                name = `${tag} ${titleMatch[1].trim()}`;
                block = block.replace(/^###\s+.+$/m, "").trim();
              }
              body = block;
            }
            
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_name=${name}\n`);
            const delimiter = "EOF_" + Math.random().toString(36).substring(2);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_body<<${delimiter}\n${body}\n${delimiter}\n`);
          '
        env:
          TAG_NAME: ${{ github.ref }}

      - name: Create Release when tag pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.release_name }}
          body: ${{ steps.changelog.outputs.release_body }}
          generate_release_notes: false

  verify-cutting:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify extension consistency (10 cut types × 8 levels × shapes/seeds)
        run: npx tsx .agents/skills/generative-puzzle-extension/scripts/verify_extension.ts

      - name: Verify incremental cutter geometry core (160 cases)
        run: npx tsx .agents/skills/generative-puzzle-extension/scripts/verify_incremental_cutter.ts

  smoke-mobile:
    # 移动端核心链轻量冒烟（1.5.14 教训：桌面通过 ≠ 移动端可交付）
    # 只防真实回归：选形状 → 难度 → 切割 → 散开 → 拖拽 + 无阻断性错误
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile core-chain smoke (iPhone viewport)
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"

